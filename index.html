<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://images.luviio.com/LUVIOO-01.png" type="image/png" />
  <title>Luviio — Smart Digital Solutions</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #000000;
      --glass: rgba(255,255,255,0.045);
      --glass-b: rgba(255,255,255,0.10);
      --glass-h: rgba(255,255,255,0.08);
      --accent: #7B8CFF;
      --accent2: #A78BFA;
      --glow: rgba(123,140,255,0.22);
      --text: #EEEEF8;
      --muted: rgba(238,238,248,0.52);
      --dim: rgba(238,238,248,0.28);
      --r: 18px;
      --nav: 66px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:var(--bg);color:var(--text);
      font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.65;
      min-height:100vh;display:flex;flex-direction:column;
      overflow-x:hidden;padding-bottom:52px;
    }
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 80% 55% at 15% 8%,rgba(123,140,255,.075) 0%,transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 82%,rgba(167,139,250,.06) 0%,transparent 55%),
        radial-gradient(ellipse 40% 40% at 55% 28%,rgba(99,102,241,.04) 0%,transparent 50%);
    }

    /* ─── NAV ─── */
    nav{
      position:fixed;top:12px;left:50%;transform:translateX(-50%);
      width:min(96%,1120px);height:var(--nav);z-index:999;
      display:flex;align-items:center;justify-content:space-between;padding:0 28px;
      background:rgba(0,0,0,.6);
      backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
      border:1px solid var(--glass-b);border-radius:22px;
      box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.055);
    }
    .logo img{height:30px;object-fit:contain;display:block;cursor:pointer}
    .nav-links{display:flex;align-items:center;gap:4px;list-style:none}
    .nav-links a{
      color:var(--muted);text-decoration:none;
      font-family:'Syne',sans-serif;font-size:13px;font-weight:500;
      padding:7px 13px;border-radius:10px;
      transition:color .2s,background .2s;letter-spacing:.01em;
    }
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--glass-h)}
    .nav-acts{display:flex;gap:8px;align-items:center}

    /* ─── BUTTONS ─── */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      font-family:'Syne',sans-serif;font-weight:600;font-size:14px;
      padding:10px 22px;border-radius:12px;border:none;cursor:pointer;
      text-decoration:none;transition:all .22s;letter-spacing:.02em;white-space:nowrap;
    }
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--glass-b)}
    .btn-ghost:hover{color:var(--text);background:var(--glass-h)}
    .btn-pri{
      background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
      color:#fff;box-shadow:0 4px 20px var(--glow);
    }
    .btn-pri:hover{transform:translateY(-1px);box-shadow:0 8px 28px var(--glow)}
    .btn-out{background:transparent;color:var(--accent);border:1px solid rgba(123,140,255,.38)}
    .btn-out:hover{background:rgba(123,140,255,.08)}
    .btn-sm{padding:8px 16px;font-size:13px;border-radius:9px}
    .btn-lg{padding:14px 30px;font-size:16px;border-radius:14px}

    /* ─── HAMBURGER ─── */
    .ham{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
    .ham span{display:block;width:22px;height:2px;background:var(--muted);border-radius:2px;transition:all .25s}
    .ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .ham.open span:nth-child(2){opacity:0}
    .ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    #mmenu{
      display:none;position:fixed;top:calc(var(--nav) + 22px);left:50%;transform:translateX(-50%);
      width:min(96%,1120px);background:rgba(0,0,0,.88);
      backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
      border:1px solid var(--glass-b);border-radius:18px;z-index:998;
      padding:14px;flex-direction:column;gap:4px;
    }
    #mmenu.open{display:flex}
    #mmenu a{
      color:var(--muted);text-decoration:none;
      font-family:'Syne',sans-serif;font-size:15px;font-weight:500;
      padding:12px 16px;border-radius:10px;transition:all .2s;
    }
    #mmenu a:hover{color:var(--text);background:var(--glass-h)}

    /* ─── APP ─── */
    #app{flex:1;padding-top:calc(var(--nav) + 26px);position:relative;z-index:1}

    /* ─── LAYOUT ─── */
    .sec{padding:90px 0}
    .sec-sm{padding:60px 0}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
    .wrap-n{max-width:760px;margin:0 auto;padding:0 24px}
    .divider{width:100%;height:1px;background:var(--glass-b)}

    /* ─── TYPE ─── */
    h1,h2,h3,h4{font-family:'Syne',sans-serif;font-weight:700;line-height:1.15}
    .disp{font-size:clamp(38px,5.8vw,74px);font-weight:800}
    .head{font-size:clamp(26px,3.8vw,46px);font-weight:700}
    .sub{font-size:clamp(17px,2.2vw,24px);font-weight:600}
    .lead{font-size:17px;color:var(--muted);line-height:1.8}
    .gt{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tag{
      display:inline-flex;align-items:center;gap:6px;
      font-size:11.5px;font-family:'Syne',sans-serif;font-weight:600;
      color:var(--accent);letter-spacing:.08em;text-transform:uppercase;
      padding:6px 14px;border-radius:100px;
      background:rgba(123,140,255,.1);border:1px solid rgba(123,140,255,.22);
      margin-bottom:18px;
    }

    /* ─── CARD ─── */
    .card{
      background:var(--glass);border:1px solid var(--glass-b);
      border-radius:var(--r);padding:30px;
      transition:border-color .25s,background .25s,transform .25s,box-shadow .25s;
    }
    .card:hover{
      border-color:rgba(123,140,255,.28);background:var(--glass-h);
      transform:translateY(-2px);box-shadow:0 14px 42px rgba(0,0,0,.3);
    }

    /* ─── HOME ─── */
    .hero{min-height:82vh;display:flex;align-items:center}
    .hero-g{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
    .hero-acts{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
    .stats-row{display:flex;gap:40px;margin-top:44px;padding-top:38px;border-top:1px solid var(--glass-b)}
    .sn{font-family:'Syne',sans-serif;font-size:28px;font-weight:800}
    .sl{font-size:13px;color:var(--dim)}

    /* ORB */
    .orb{
      width:360px;height:360px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,rgba(123,140,255,.28) 0%,rgba(167,139,250,.12) 42%,transparent 70%);
      box-shadow:0 0 80px rgba(123,140,255,.18),inset 0 0 60px rgba(123,140,255,.08);
      animation:float 6s ease-in-out infinite;position:relative;
    }
    .orb::after{content:'';position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 60% 28%,rgba(255,255,255,.07) 0%,transparent 50%)}
    .ring{position:absolute;border-radius:50%;border:1px solid rgba(123,140,255,.14);animation:spin 18s linear infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
    .page{animation:fadeUp .32s ease forwards}

    .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:52px}
    .ficon{width:46px;height:46px;border-radius:13px;background:rgba(123,140,255,.1);border:1px solid rgba(123,140,255,.2);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:18px}

    /* ─── PRICING ─── */
    .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px}
    .pc{border-radius:var(--r);padding:34px;border:1px solid var(--glass-b);background:var(--glass);position:relative;transition:all .25s}
    .pc:hover{transform:translateY(-4px);box-shadow:0 22px 60px rgba(0,0,0,.35)}
    .pc.feat{background:linear-gradient(135deg,rgba(123,140,255,.12) 0%,rgba(167,139,250,.07) 100%);border-color:rgba(123,140,255,.35);box-shadow:0 0 0 1px rgba(123,140,255,.14),0 20px 50px rgba(123,140,255,.11)}
    .badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Syne',sans-serif;font-size:10.5px;font-weight:700;padding:5px 14px;border-radius:100px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
    .pa{font-family:'Syne',sans-serif;font-size:40px;font-weight:800}
    .pc-cur{font-size:20px;font-weight:600;color:var(--muted);vertical-align:super}
    .pc-per{font-size:13px;color:var(--dim);margin-left:3px}
    .pfl{list-style:none;margin:24px 0;display:flex;flex-direction:column;gap:11px}
    .pfl li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
    .pfl li::before{content:'✓';color:var(--accent);font-weight:700;font-size:13px;flex-shrink:0}

    /* ─── PRODUCT ─── */
    .prdgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;margin-top:52px}
    .prdcard{border-radius:var(--r);padding:38px;border:1px solid var(--glass-b);background:var(--glass);transition:all .25s}
    .prdcard:hover{border-color:rgba(123,140,255,.26);background:var(--glass-h);transform:translateY(-3px)}
    .prdicon{font-size:32px;width:60px;height:60px;border-radius:17px;background:rgba(123,140,255,.1);border:1px solid rgba(123,140,255,.2);display:flex;align-items:center;justify-content:center;margin-bottom:18px}

    /* ─── TEAM ─── */
    .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:52px}
    .tc{border-radius:var(--r);padding:34px 26px;border:1px solid var(--glass-b);background:var(--glass);text-align:center;transition:all .25s}
    .tc:hover{border-color:rgba(123,140,255,.26);background:var(--glass-h);transform:translateY(-3px);box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,rgba(123,140,255,.28),rgba(167,139,250,.18));margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:24px;font-weight:800;border:2px solid rgba(123,140,255,.24);box-shadow:0 0 28px rgba(123,140,255,.14)}
    .tn{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;margin-bottom:5px}
    .tr{font-size:12.5px;color:var(--accent);font-family:'Syne',sans-serif;font-weight:500}

    /* ─── ABOUT ─── */
    .agrid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;margin-top:56px}
    .avis{border-radius:22px;background:linear-gradient(135deg,rgba(123,140,255,.11) 0%,rgba(167,139,250,.05) 100%);border:1px solid rgba(123,140,255,.18);height:320px;display:flex;align-items:center;justify-content:center;font-size:68px;box-shadow:0 0 60px rgba(123,140,255,.09)}

    /* ─── SUPPORT/CONTACT ─── */
    .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:38px}
    .fg{margin-bottom:15px}
    .fg label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
    .fg input,.fg textarea{
      width:100%;background:rgba(255,255,255,.04);border:1px solid var(--glass-b);
      border-radius:11px;padding:12px 15px;color:var(--text);
      font-family:'DM Sans',sans-serif;font-size:15px;outline:none;
      transition:border-color .2s,background .2s;resize:vertical;
    }
    .fg input:focus,.fg textarea:focus{border-color:var(--accent);background:rgba(123,140,255,.045)}
    .fg input::placeholder,.fg textarea::placeholder{color:var(--dim)}
    textarea{min-height:115px}

    /* ─── AUTH MODAL ─── */
    .ov{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
    .ov.open{opacity:1;pointer-events:all}
    .modal{background:rgba(10,10,16,.96);border:1px solid var(--glass-b);border-radius:22px;padding:42px 38px;width:100%;max-width:430px;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);transform:translateY(18px);transition:transform .3s;position:relative}
    .ov.open .modal{transform:translateY(0)}
    .mcl{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:6px;border-radius:8px;transition:color .2s,background .2s}
    .mcl:hover{color:var(--text);background:var(--glass-h)}
    .mlogo{text-align:center;margin-bottom:26px}
    .mlogo img{height:34px}
    .modal h2{text-align:center;font-size:21px;margin-bottom:7px}
    .modal p{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px}
    .aerr{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:11px 15px;font-size:13px;color:#FC8181;margin-bottom:14px;display:none}
    .aerr.show{display:block}
    .aok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:10px;padding:11px 15px;font-size:13px;color:#6EE7B7;margin-bottom:14px;display:none}
    .aok.show{display:block}
    .aswitch{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px}
    .aswitch a{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:500}
    .aswitch a:hover{text-decoration:underline}

    /* ─── TOAST ─── */
    #toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(28,28,38,.96);border:1px solid var(--glass-b);border-radius:12px;padding:13px 22px;font-size:14px;color:var(--text);z-index:3000;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.38);white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    #toast.ok{border-color:rgba(34,197,94,.3)}
    #toast.err{border-color:rgba(239,68,68,.3)}

    /* ─── FOOTER ─── */
    footer{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:13px 30px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim)}
    footer a{color:var(--dim);text-decoration:none;transition:color .2s}
    footer a:hover{color:var(--muted)}
    .fr{display:flex;align-items:center;gap:12px}
    .fs{opacity:.3}

    /* ─── LOADING ─── */
    #ld{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
    #ld img{height:38px;animation:float 2s ease-in-out infinite}
    #ld.hidden{opacity:0;pointer-events:none}

    /* ─── RESPONSIVE ─── */
    @media(max-width:920px){
      .nav-links,.nav-acts .btn-ghost:not(#nav-so){display:none}
      .ham{display:flex}
      .hero-g{grid-template-columns:1fr}
      .hero-vis{display:none}
      .fgrid,.pgrid,.tgrid{grid-template-columns:repeat(2,1fr)}
      .prdgrid,.agrid{grid-template-columns:1fr}
    }
    @media(max-width:580px){
      .fgrid,.pgrid,.tgrid,.prdgrid,.sgrid,.cgrid{grid-template-columns:1fr}
      .stats-row{flex-wrap:wrap;gap:22px}
      footer{flex-direction:column;gap:7px;text-align:center}
      .fr{flex-wrap:wrap;justify-content:center}
      nav{padding:0 16px}
      .modal{padding:32px 22px}
    }
  </style>
</head>
<body>

<div id="ld"><img src="https://images.luviio.com/LUVIOO-06.png" alt="Luviio" /></div>

<nav>
  <div class="logo"><img src="https://images.luviio.com/LUVIOO-06.png" alt="Luviio" id="nav-home" /></div>
  <ul class="nav-links">
    <li><a href="/" data-route="/">Home</a></li>
    <li><a href="/pricing" data-route="/pricing">Pricing</a></li>
    <li><a href="/product" data-route="/product">Product</a></li>
    <li><a href="/about" data-route="/about">About</a></li>
    <li><a href="/team" data-route="/team">Team</a></li>
    <li><a href="/support" data-route="/support">Support</a></li>
    <li><a href="/contact" data-route="/contact">Contact</a></li>
  </ul>
  <div class="nav-acts">
    <button class="btn btn-ghost btn-sm" id="nav-li">Sign In</button>
    <button class="btn btn-pri btn-sm" id="nav-su">Get Started</button>
    <button class="btn btn-sm" id="nav-usr" style="display:none;background:var(--glass);border:1px solid var(--glass-b);color:var(--text)">Account</button>
    <button class="btn btn-ghost btn-sm" id="nav-so" style="display:none">Sign Out</button>
  </div>
  <button class="ham" id="ham"><span></span><span></span><span></span></button>
</nav>

<div id="mmenu">
  <a href="/" data-route="/">Home</a>
  <a href="/pricing" data-route="/pricing">Pricing</a>
  <a href="/product" data-route="/product">Product</a>
  <a href="/about" data-route="/about">About</a>
  <a href="/team" data-route="/team">Team</a>
  <a href="/support" data-route="/support">Support</a>
  <a href="/contact" data-route="/contact">Contact</a>
</div>

<div id="app"></div>

<!-- AUTH MODAL -->
<div class="ov" id="ov">
  <div class="modal">
    <button class="mcl" id="mcl">✕</button>
    <div class="mlogo"><img src="https://images.luviio.com/LUVIOO-06.png" alt="Luviio" /></div>
    <div id="ac"></div>
  </div>
</div>

<div id="toast"></div>

<footer>
  <span>© 2025 – 2026 <a href="https://luviio.com" target="_blank">luviio.com</a>. All rights reserved.</span>
  <div class="fr">
    <a href="https://luviio.com/terms" target="_blank">Terms</a>
    <span class="fs">•</span>
    <a href="https://luviio.com/privacy" target="_blank">Policy</a>
    <span class="fs">|</span>
    <span>Malaysia</span>
  </div>
</footer>

<script>
// ── SUPABASE ──
const SB_URL='https://anlzdjdnchcrjuwobkwb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFubHpkamRuY2hjcmp1d29ia3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzY0MDYsImV4cCI6MjA5MzMxMjQwNn0.PBGCKLkMwY3O8gvo-i2JvnGCrbxHulBCvK2srh7Z2gI';
const sb=supabase.createClient(SB_URL,SB_KEY);
let user=null;

// ── PAGES ──
const pages={
  '/':{title:'Luviio — Smart Digital Solutions for Malaysia',fn:pgHome},
  '/home':{title:'Luviio — Smart Digital Solutions for Malaysia',fn:pgHome},
  '/pricing':{title:'Pricing — Luviio | Affordable Plans in MYR',fn:pgPricing},
  '/product':{title:'Products — Luviio | Web, Mobile & AI Solutions',fn:pgProduct},
  '/about':{title:'About Us — Luviio | Built for Malaysian Businesses',fn:pgAbout},
  '/team':{title:'Our Team — Luviio | Meet the Founders',fn:pgTeam},
  '/support':{title:'Support — Luviio | Help & Resources',fn:pgSupport},
  '/contact':{title:'Contact — Luviio | Get in Touch',fn:pgContact},
};

function nav(path){
  const pg=pages[path]||pages['/'];
  document.title=pg.title;
  history.pushState({},path,path);
  document.getElementById('app').innerHTML=`<div class="page">${pg.fn()}</div>`;
  activeNav(path);
  document.getElementById('mmenu').classList.remove('open');
  document.getElementById('ham').classList.remove('open');
  window.scrollTo({top:0});
  bind();
}

function activeNav(path){
  document.querySelectorAll('[data-route]').forEach(a=>{
    const r=a.getAttribute('data-route');
    a.classList.toggle('active',r===path||(path==='/home'&&r==='/'));
  });
}

function bind(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.onclick=e=>{e.preventDefault();nav(el.getAttribute('data-route'))};
  });
}

window.addEventListener('popstate',()=>nav(location.pathname));

// ── TOAST ──
function toast(msg,t=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${t} show`;
  setTimeout(()=>el.classList.remove('show'),3200);
}

// ── NAV AUTH ──
function updNav(){
  const li=document.getElementById('nav-li'),su=document.getElementById('nav-su');
  const usr=document.getElementById('nav-usr'),so=document.getElementById('nav-so');
  if(user){
    li.style.display='none';su.style.display='none';
    usr.style.display='';so.style.display='';
    usr.textContent=user.email.split('@')[0];
  }else{
    li.style.display='';su.style.display='';
    usr.style.display='none';so.style.display='none';
  }
}

sb.auth.onAuthStateChange((_,ses)=>{user=ses?.user||null;updNav()});

// ── MODAL ──
function openAuth(mode='signin'){
  document.getElementById('ov').classList.add('open');
  renderAC(mode);
}
function closeAuth(){document.getElementById('ov').classList.remove('open')}
document.getElementById('mcl').onclick=closeAuth;
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeAuth()};
document.getElementById('nav-li').onclick=()=>openAuth('signin');
document.getElementById('nav-su').onclick=()=>openAuth('signup');
document.getElementById('nav-so').onclick=async()=>{await sb.auth.signOut();toast('Signed out','ok')};
document.getElementById('nav-home').onclick=()=>nav('/');

function renderAC(mode){
  const c=document.getElementById('ac');
  if(mode==='signin'){
    c.innerHTML=`
      <h2>Welcome back</h2>
      <p>Sign in to your Luviio account</p>
      <div class="aerr" id="ae"></div>
      <div class="aok" id="as"></div>
      <div class="fg"><label>Email</label><input type="email" id="ae1" placeholder="you@example.com" autocomplete="email"/></div>
      <div class="fg"><label>Password</label><input type="password" id="ap1" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="btn btn-pri" style="width:100%;margin-top:6px" id="asb">Sign In</button>
      <div class="aswitch">No account? <a onclick="renderAC('signup')">Sign up free</a></div>
      <div class="aswitch" style="margin-top:8px"><a onclick="renderAC('reset')">Forgot password?</a></div>`;
    document.getElementById('asb').onclick=async()=>{
      const email=document.getElementById('ae1').value.trim();
      const pass=document.getElementById('ap1').value;
      setBusy(true);
      const{error}=await sb.auth.signInWithPassword({email,password:pass});
      setBusy(false);
      if(error)showAErr(error.message);
      else{closeAuth();toast('Welcome back! 👋','ok');}
    };
  }else if(mode==='signup'){
    c.innerHTML=`
      <h2>Create account</h2>
      <p>Join Luviio — a verification email will be sent</p>
      <div class="aerr" id="ae"></div>
      <div class="aok" id="as"></div>
      <div class="fg"><label>Full Name</label><input type="text" id="an1" placeholder="Your full name" autocomplete="name"/></div>
      <div class="fg"><label>Email</label><input type="email" id="ae1" placeholder="you@example.com" autocomplete="email"/></div>
      <div class="fg"><label>Password</label><input type="password" id="ap1" placeholder="Min. 8 characters" autocomplete="new-password"/></div>
      <button class="btn btn-pri" style="width:100%;margin-top:6px" id="asb">Create Account</button>
      <div class="aswitch">Have an account? <a onclick="renderAC('signin')">Sign in</a></div>`;
    document.getElementById('asb').onclick=async()=>{
      const name=document.getElementById('an1').value.trim();
      const email=document.getElementById('ae1').value.trim();
      const pass=document.getElementById('ap1').value;
      if(!name){showAErr('Please enter your name');return;}
      if(pass.length<8){showAErr('Password must be at least 8 characters');return;}
      setBusy(true);
      const{error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name},emailRedirectTo:'https://luviio.com'}});
      setBusy(false);
      if(error)showAErr(error.message);
      else showAOk('✉️ Verification email sent! Check your inbox to activate your membership.');
    };
  }else if(mode==='reset'){
    c.innerHTML=`
      <h2>Reset password</h2>
      <p>We'll email you a secure reset link</p>
      <div class="aerr" id="ae"></div>
      <div class="aok" id="as"></div>
      <div class="fg"><label>Email</label><input type="email" id="ae1" placeholder="you@example.com" autocomplete="email"/></div>
      <button class="btn btn-pri" style="width:100%;margin-top:6px" id="asb">Send Reset Link</button>
      <div class="aswitch"><a onclick="renderAC('signin')">← Back to sign in</a></div>`;
    document.getElementById('asb').onclick=async()=>{
      const email=document.getElementById('ae1').value.trim();
      setBusy(true);
      const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://luviio.com'});
      setBusy(false);
      if(error)showAErr(error.message);
      else showAOk('Reset link sent! Please check your email inbox.');
    };
  }
}

function setBusy(on){const b=document.getElementById('asb');if(b){b.disabled=on;if(on)b.textContent='Please wait…';}}
function showAErr(m){const e=document.getElementById('ae');if(e){e.textContent=m;e.classList.add('show');}}
function showAOk(m){const s=document.getElementById('as');if(s){s.textContent=m;s.classList.add('show');}}
